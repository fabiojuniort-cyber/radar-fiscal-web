name: Read-only npm dependency audit (diagnostic)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/frontend-npm-audit-review.yml'

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Audit exact committed package-lock.json (no changes)
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json --audit-level=low > /tmp/frontend-npm-audit.json || true
          node <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync('/tmp/frontend-npm-audit.json','utf8'));
          console.log('AUDIT_COUNTS '+JSON.stringify(data.metadata?.vulnerabilities??{}));
          const list=Object.entries(data.vulnerabilities??{}).map(([name,v])=>({
            name,severity:v.severity,range:v.range,isDirect:v.isDirect,
            nodes:v.nodes?.length??0,fixAvailable:v.fixAvailable,
            via:(v.via??[]).map(x=>typeof x==='string'?x:{
              title:x.title,range:x.range,url:x.url,severity:x.severity
            })
          }));
          const rank={critical:0,high:1,moderate:2,low:3,info:4};
          list.sort((a,b)=>(rank[a.severity]??9)-(rank[b.severity]??9));
          for(const item of list) console.log('AUDIT_FINDING '+JSON.stringify(item));
          if(data.error) console.log('AUDIT_COMMAND_ERROR '+JSON.stringify(data.error));
          NODE
