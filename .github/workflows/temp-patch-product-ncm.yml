name: Temporary Product NCM panel patch

on:
  push:
    branches:
      - feat/profile-product-ncm-ui

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-product-ncm-ui

      - name: Apply exact Product/NCM integration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/authenticated-product-panel.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { NewsSection as LiveNewsSection } from './news-section'\n"
          import_line = "import { ProductNcmProfiles } from './product-ncm-profiles'\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('Expected NewsSection import anchor exactly once')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = '''        <div className="tp-profile-cnaes tp-profile-cnaes-table">
          <strong>CNAEs capturados</strong>
          {cnaes.length ? (
            <div className="tp-cnae-profile-table">
              <div className="tp-cnae-profile-head">
                <span>CNAE</span><span>Atividade</span><span>Setor</span><span>Produto</span><span>NCM</span>
              </div>
              {cnaes.map((cnae) => (
                <div className="tp-cnae-profile-row" key={cnae.code}>
                  <b>{cnae.code}</b>
                  <span>{cnae.description}</span>
                  <span>{cnaeSector(cnae.code)}</span>
                  <span className="tp-parameter-empty">Adicionar produto</span>
                  <span className="tp-parameter-empty">Adicionar NCM</span>
                </div>
              ))}
            </div>
          ) : (
            <p>Nenhum CNAE cadastrado.</p>
          )}
        </div>'''

          new = '''        <div className="tp-profile-cnaes tp-profile-cnaes-table">
          <strong>CNAEs capturados</strong>
          {cnaes.length ? (
            <ProductNcmProfiles
              apiFetch={apiFetch}
              tenantId={tenantId}
              companyId={company.id}
              cnaes={cnaes}
              sectorLabel={cnaeSector}
            />
          ) : (
            <p>Nenhum CNAE cadastrado.</p>
          )}
        </div>'''

          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('Expected static CNAE Product/NCM block exactly once')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit scoped panel change
        run: |
          if git diff --quiet -- src/authenticated-product-panel.tsx; then
            echo "Panel already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authenticated-product-panel.tsx
          git commit -m "feat(ncm): connect Product NCM editor to tax profile"
          git push origin HEAD:feat/profile-product-ncm-ui
