name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate official PNG assets
        run: |
          mkdir -p playwright-artifacts
          node scripts/validate-png.mjs \
            public/brand/tribusca-logo-horizontal-dark.png \
            public/brand/tribusca-icon.png | tee playwright-artifacts/PNG_INTEGRITY.txt
          node --test scripts/validate-png.test.mjs | tee playwright-artifacts/PNG_NEGATIVE_TESTS.txt
          printf '%s  %s\n' \
            'c541566c88a53d4dac0e473f430c4d9a26bb40c9ecaa47d96ae8a8998e37da99' \
            'public/brand/tribusca-logo-horizontal-dark.png' \
            '7f289e7e09eb914464f14bd86178d7d73a6066daae8d3ee269f7a34f4acc6268' \
            'public/brand/tribusca-icon.png' \
            | tee playwright-artifacts/BRAND_ASSETS.sha256 \
            | sha256sum --check --strict

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Record browser evidence metadata
        if: always()
        run: |
          mkdir -p playwright-artifacts
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > playwright-artifacts/HEAD.txt
          printf '%s\n' "Chromium / local Vite preview from the CI build" > playwright-artifacts/RUNTIME.txt
          printf '%s\n' "1440x900, 1920x1080, 390x844, 360x800" > playwright-artifacts/VIEWPORTS.txt

      - name: Upload WEB-09 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web09-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report
            test-results
            playwright-artifacts
          if-no-files-found: warn
          retention-days: 14
