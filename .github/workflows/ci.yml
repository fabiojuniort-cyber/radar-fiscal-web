name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify brand asset
        run: |
          test -s public/brand/tribusca-logo-horizontal-dark.png
          sha256sum public/brand/tribusca-logo-horizontal-dark.png

      - name: Build
        run: npm run build
