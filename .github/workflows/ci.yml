name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify brand asset
        run: |
          test -s public/brand/tribusca-logo-horizontal-dark.png
          sha256sum public/brand/tribusca-logo-horizontal-dark.png

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Record browser evidence metadata
        if: always()
        run: |
          mkdir -p playwright-artifacts
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > playwright-artifacts/HEAD.txt
          printf '%s\n' "Chromium / local Vite preview from the CI build" > playwright-artifacts/RUNTIME.txt
          printf '%s\n' "1440x900, 1920x1080, 390x844, 360x800" > playwright-artifacts/VIEWPORTS.txt

      - name: Upload WEB-07 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web07-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report
            test-results
            playwright-artifacts
          if-no-files-found: warn
          retention-days: 14
