name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main

# Replace only older runs of the same PR. Non-PR runs have independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}


      - name: Validate CI routing
        run: python3 -m unittest discover -s .github/scripts -p test_ci_plan.py

      - name: Plan CI gates
        id: ci-plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: python3 .github/scripts/ci-plan.py --kind web

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          mkdir -p playwright-artifacts
          set -o pipefail
          npm run typecheck 2>&1 | tee playwright-artifacts/TYPECHECK.txt

      - name: Test
        run: |
          mkdir -p playwright-artifacts
          set -o pipefail
          npm test 2>&1 | tee playwright-artifacts/TEST.txt

      - name: Validate official PNG assets
        run: |
          mkdir -p playwright-artifacts
          set -o pipefail
          node scripts/validate-png.mjs \
            public/brand/tribusca-logo-horizontal-dark.png \
            public/brand/tribusca-icon.png \
            public/brand/trifaros-logo-horizontal.png \
            public/brand/trifaros-logo-horizontal-reverse.png | tee playwright-artifacts/PNG_INTEGRITY.txt
          node --test scripts/validate-png.test.mjs | tee playwright-artifacts/PNG_NEGATIVE_TESTS.txt
          printf '%s  %s\n' \
            'c541566c88a53d4dac0e473f430c4d9a26bb40c9ecaa47d96ae8a8998e37da99' \
            'public/brand/tribusca-logo-horizontal-dark.png' \
            '7f289e7e09eb914464f14bd86178d7d73a6066daae8d3ee269f7a34f4acc6268' \
            'public/brand/tribusca-icon.png' \
            'a9e4dab1392861c1927629bd181a60c462c32514e9427cc2ef8e3da0e2a64b4f' \
            'public/brand/trifaros-logo-horizontal.png' \
            'b88df4e216fb64821a28c6c990906520c01554ff6a9c2b1279b827db76175926' \
            'public/brand/trifaros-logo-horizontal-reverse.png' \
            | tee playwright-artifacts/BRAND_ASSETS.sha256 \
            | sha256sum --check --strict

      - name: Build
        run: npm run build

      - name: Build demo-enabled browser target
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: VITE_ENABLE_DEMO_ACCESS=true npm run build

      - name: Install Chromium for Playwright
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: steps.ci-plan.outputs.full_regression == 'true'
        run: npm run test:e2e

      - name: Record browser evidence metadata
        if: ${{ !cancelled() && steps.ci-plan.outputs.full_regression == 'true' }}
        run: |
          mkdir -p playwright-artifacts
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > playwright-artifacts/HEAD.txt
          printf '%s\n' "Chromium / local Vite preview from the CI build" > playwright-artifacts/RUNTIME.txt
          printf '%s\n' "1440x900, 1920x1080, 390x844, 360x800" > playwright-artifacts/VIEWPORTS.txt


      - name: Require full regression before merge
        if: ${{ !cancelled() }}
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: python3 .github/scripts/ci-plan.py --kind web --require-full

      - name: Record CI mode
        if: ${{ !cancelled() }}
        env:
          CI_MODE: ${{ steps.ci-plan.outputs.full_regression == 'true' && 'FULL_REGRESSION' || 'DRAFT_FAST_ONLY' }}
        run: |
          mkdir -p playwright-artifacts
          printf '%s\n' "$CI_MODE" > playwright-artifacts/CI-MODE.txt

      - name: Upload WEB-14 browser evidence
        if: always()
        # Evidence only: a full artifact quota must not fail a green run.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web14-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report
            test-results
            playwright-artifacts
          if-no-files-found: warn
          retention-days: 14
